<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>策划AI工具箱</title>
    <link rel="icon" href="https://q1.com/favicon.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Theme tokens used across the whole UI */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #2d3748;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --bg-shift-x: 0px;
            --bg-shift-y: 0px;
        }

        /* Page shell: full-height flex layout with a dark backdrop */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.14), transparent 30%),
                #0f172a;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative glow and grid layers */
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -20%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.15), transparent 22%),
                radial-gradient(circle at 82% 28%, rgba(129, 140, 248, 0.13), transparent 24%),
                radial-gradient(circle at 54% 78%, rgba(14, 165, 233, 0.09), transparent 30%);
            filter: blur(42px);
            animation: bgDrift 18s ease-in-out infinite alternate;
        }

        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 120px 120px;
            opacity: 0.12;
            mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
            animation: gridFloat 26s linear infinite;
        }

        /* Non-interactive background layer for orbs and particles */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            transform: translate3d(var(--bg-shift-x), var(--bg-shift-y), 0);
            transition: transform 120ms ease-out;
        }

        .bg-orb {
            position: absolute;
            border-radius: 999px;
            filter: blur(20px);
            opacity: 0.85;
            mix-blend-mode: screen;
            animation: orbFloat 14s ease-in-out infinite;
        }

        .orb-1 {
            width: 240px;
            height: 240px;
            left: -40px;
            top: 12%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.42), rgba(56, 189, 248, 0));
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            right: -80px;
            top: 18%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.28), rgba(99, 102, 241, 0));
            animation-duration: 18s;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            left: 28%;
            bottom: -90px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0));
            animation-duration: 20s;
            animation-delay: -8s;
        }

        .bg-particles {
            position: absolute;
            inset: 0;
        }

        .particle {
            position: absolute;
            width: var(--size);
            height: var(--size);
            left: var(--left);
            top: var(--top);
            border-radius: 999px;
            background: rgba(226, 232, 240, var(--alpha));
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.18);
            animation: particleDrift var(--duration) linear infinite;
            animation-delay: var(--delay);
        }

        /* Left navigation panel */
        .sidebar {
            width: 220px;
            background: rgba(0, 0, 0, 0.2);
            padding: 24px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1;
            backdrop-filter: blur(14px);
        }
        .nav-item { padding: 12px; color: var(--text-dim); cursor: pointer; border-radius: 8px; transition: 0.3s; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: var(--accent-blue); color: #000; font-weight: bold; }
        /* Main content column */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        /* Search bar and action button row */
        .top-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        /* Search field that filters the visible cards */
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #1e293b;
            color: white;
            outline: none;
            margin-bottom: 0;
            flex: 1 1 320px;
        }
        /* Card grid layout */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; margin-bottom: 40px; }

        .tool-sections {
            display: flex;
            flex-direction: column;
            gap: 28px;
            width: 100%;
        }

        .tool-section {
            position: relative;
            scroll-margin-top: 28px;
        }

        .tool-section .section-title {
            margin-top: 0;
        }

        .section-anchor {
            position: absolute;
            top: -24px;
            left: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        /* Primary action button aligned with the search bar */
        .add-float-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.98), rgba(59, 130, 246, 0.92));
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            white-space: nowrap;
        }

        .add-float-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.45);
            filter: brightness(1.03);
        }

        .add-float-btn:active {
            transform: translateY(0);
        }

        /* Individual tool card */
        .card {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
                #1e293b;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(148, 163, 184, 0.15);
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
            height: 160px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-left: 4px solid rgba(var(--card-accent-rgb), 0.95);
            background:
                linear-gradient(135deg, rgba(var(--card-accent-rgb), 0.16), transparent 32%),
                radial-gradient(circle at top right, rgba(var(--card-accent-rgb), 0.14), transparent 36%);
            opacity: 0.95;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: auto -24px -28px auto;
            width: 112px;
            height: 112px;
            background: radial-gradient(circle, rgba(var(--card-accent-rgb), 0.14), transparent 68%);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            transform: scale(0.9);
        }

        .card-badge {
            position: absolute;
            right: 14px;
            bottom: 12px;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(var(--card-accent-rgb), 0.46);
            background:
                radial-gradient(circle at 30% 30%, rgba(var(--card-accent-rgb), 0.14), rgba(var(--card-accent-rgb), 0.03) 55%, rgba(15, 23, 42, 0.34) 100%);
            border: 1px solid rgba(var(--card-accent-rgb), 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            opacity: 0.85;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease, color 180ms ease;
            z-index: 1;
        }

        .card:hover .card-badge {
            opacity: 1;
            transform: translateY(-1px);
            color: rgba(var(--card-accent-rgb), 0.62);
        }

        .card-badge i {
            opacity: 0.9;
        }

        .card:hover {
            border-color: rgba(var(--card-accent-rgb), 0.45);
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(2, 6, 23, 0.28);
        }

        .card:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .card h3 {
            color: #fff;
            margin: 0 0 12px 0;
            font-size: 0.98rem;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.35;
            width: 100%;
        }

        .card-title {
            flex: 1 1 auto;
            min-width: 0;
            padding-right: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card p {
            color: var(--text-dim);
            font-size: 0.78rem;
            line-height: 1.55;
            margin: 0;
            max-width: 92%;
        }

        .tag {
            font-size: 0.68rem;
            background: rgba(15, 23, 42, 0.72);
            padding: 3px 9px;
            border-radius: 999px;
            color: rgba(226, 232, 240, 0.92);
            border: 1px solid rgba(var(--card-accent-rgb), 0.3);
            display: inline-flex;
            align-items: center;
            margin-bottom: 12px;
            letter-spacing: 0.04em;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 0 0 auto;
            margin-left: auto;
            white-space: nowrap;
        }
        .btn-icon { cursor: pointer; color: #64748b; transition: 0.2s; }
        .btn-icon:hover { color: var(--accent-blue); }
        .star-btn { color: #475569; transition: 0.2s; cursor: pointer; }
        .star-btn.active { color: #f59e0b; fill: #f59e0b; }

        /* Section heading shared by pinned tools and all tools */
        .section-title { font-size: 0.85rem; color: #94a3b8; margin: 20px 0; display: flex; align-items: center; gap: 8px; }
        /* Footer note at the bottom of the page */
        .footer { margin-top: auto; padding-top: 40px; color: #475569; font-size: 0.75rem; text-align: center; }

        /* Dimmed backdrop used by the detail modal */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        /* Modal card that shows tool details */
        .modal { background: #1e293b; padding: 25px; border-radius: 12px; width: 500px; border: 1px solid #334155; color: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }

        #fullScreenOverlay { z-index: 2000; cursor: zoom-out; }
        #fullScreenOverlay img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* Background animation: smooth drifting glow */
        @keyframes bgDrift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(4%, -3%, 0) scale(1.08); }
        }

        /* Grid animation: subtle vertical movement */
        @keyframes gridFloat {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(0, -120px, 0); }
        }

        /* Orb animation: slow floating motion */
        @keyframes orbFloat {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(0, -22px, 0) scale(1.06); }
        }

        /* Particle animation: drift out and fade away */
        @keyframes particleDrift {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0; }
            10% { opacity: var(--alpha); }
            50% { transform: translate3d(var(--move-x), var(--move-y), 0) scale(1.2); }
            100% { transform: translate3d(calc(var(--move-x) * 2), calc(var(--move-y) * 2), 0) scale(0.9); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after,
            .bg-orb,
            .particle,
            .card,
            .card::after,
            .add-float-btn {
                animation: none !important;
                transition: none !important;
            }

            .bg-layer {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
        <div id="bgParticles" class="bg-particles"></div>
    </div>

    <!-- Modal used for tool details -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="margin-top:0;">Feature Details</h3>
            <p id="modalDesc" style="color:var(--text-dim); font-size: 0.85rem; margin-bottom:15px;"></p>
            <img id="modalImage" src="" style="width:100%; cursor: zoom-in; border-radius:4px; margin-bottom:15px; display:none; border:1px solid #475569;" onclick="showFullImage(this.src)">
            <button onclick="closeModal()" style="width:100%; padding:10px; background:var(--accent-blue); border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Close</button>
        </div>
    </div>

    <!-- Fullscreen image preview overlay -->
    <div id="fullScreenOverlay" class="modal-overlay" onclick="closeFullImage()">
        <img id="fullImage" src="">
    </div>

    <!-- 左侧导航：点击切换不同分类 -->
    <!-- Left navigation: switch categories -->
    <nav class="sidebar">
        <h2 style="color: #64748b; font-size: 0.7rem; margin-bottom: 30px;">Navigation</h2>
        <div class="nav-item active" data-section="doc" onclick="loadPage('doc', this)"><i data-lucide="file-text" size="18"></i> 文档助手</div>
        <div class="nav-item" data-section="art" onclick="loadPage('art', this)"><i data-lucide="palette" size="18"></i> 参考图助手</div>
        <div class="nav-item" data-section="web" onclick="loadPage('web', this)"><i data-lucide="globe" size="18"></i> 相关网站</div>
        <div class="nav-item" data-section="system" onclick="loadPage('system', this)"><i data-lucide="settings" size="18"></i> 其他</div>
    
    </nav>

    <main class="main-content">
        <!-- 顶部工具条：搜索框在左，添加按钮在右 -->
        <!-- Top toolbar: search on the left, add button on the right -->
        <div class="top-toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search tools..." oninput="filterCards()">
            <a class="add-float-btn" href="https://docs.qq.com/sheet/DV2t1ZGJBZ0duSEpt?no_promotion=1&is_blank_or_template=blank&tab=BB08J2" target="_blank" rel="noopener noreferrer">
                <i data-lucide="plus" size="16"></i>
                添加
            </a>
        </div>

        <!-- 收藏区：总览时优先显示收藏卡片 -->
        <!-- Pinned section: favorites shown first on Overview -->
        <div id="pinnedSection" style="display:none;">
            <div class="section-title"><i data-lucide="star" size="16"></i> Pinned Tools</div>
            <div id="pinnedArea" class="grid"></div>
        </div>

        <!-- 主列表区：显示当前页面对应的工具卡片 -->
        <!-- Main list: cards for the current page -->
        <div id="regularArea" class="tool-sections"></div>

        <footer class="footer">© Designed by Zhang Junhui</footer>
    </main>

    <script>
        // 从 tools.json 读取后的全部工具数据
        /* Application state loaded from tools.json */
        let contentData = {};
        // 收藏状态保存在浏览器本地，刷新后仍然保留
        /* Favorite IDs persist in localStorage */
        let favorites = JSON.parse(localStorage.getItem('favs') || '[]');

        // 生成背景粒子，让页面看起来更有层次
        /* Build the animated background particles */
        function createBackgroundParticles() {
            const layer = document.getElementById('bgParticles');
            if (!layer) return;

            const particles = Array.from({ length: 24 }, () => {
                const size = (Math.random() * 4 + 1.5).toFixed(1) + 'px';
                const left = (Math.random() * 100).toFixed(2) + '%';
                const top = (Math.random() * 100).toFixed(2) + '%';
                const alpha = (Math.random() * 0.35 + 0.15).toFixed(2);
                const duration = (Math.random() * 16 + 10).toFixed(2) + 's';
                const delay = (-Math.random() * 18).toFixed(2) + 's';
                const moveX = (Math.random() * 160 - 80).toFixed(0) + 'px';
                const moveY = (Math.random() * 120 - 60).toFixed(0) + 'px';

                return `<span class="particle" style="--size:${size};--left:${left};--top:${top};--alpha:${alpha};--duration:${duration};--delay:${delay};--move-x:${moveX};--move-y:${moveY};"></span>`;
            });

            layer.innerHTML = particles.join('');
        }

        // 监听鼠标移动，给背景一点轻微的漂移效果
        /* Add subtle parallax movement based on pointer position */
        function bindBackgroundMotion() {
            const update = (event) => {
                const x = ((event.clientX || window.innerWidth / 2) - window.innerWidth / 2) / 60;
                const y = ((event.clientY || window.innerHeight / 2) - window.innerHeight / 2) / 80;
                document.documentElement.style.setProperty('--bg-shift-x', `${x}px`);
                document.documentElement.style.setProperty('--bg-shift-y', `${y}px`);
            };

            window.addEventListener('pointermove', update, { passive: true });
            window.addEventListener('pointerleave', () => {
                document.documentElement.style.setProperty('--bg-shift-x', '0px');
                document.documentElement.style.setProperty('--bg-shift-y', '0px');
            });
        }

        /* Order and labels for the category sections shown on the page */
        const categoryOrder = [
            { key: 'doc', title: 'AI文档助手', icon: 'file-text' },
            { key: 'art', title: 'AI参考图助手', icon: 'palette' },
            { key: 'web', title: '相关网站', icon: 'globe' },
            { key: 'Cod', title: 'Codex', icon: 'settings' }
        ];

        let scrollObserver = null;
        let scrollRoot = null;
        let scrollTicking = false;

        // 页面初始化：加载数据、创建背景、默认定位到文档助手
        /* Initial page bootstrap */
        async function init() {
            try {
                const res = await fetch(`tools.json?v=${Date.now()}`, { cache: 'no-store' });
                contentData = await res.json();
                createBackgroundParticles();
                bindBackgroundMotion();
                renderPageContent();
                bindScrollSpy();
                setActiveNav('doc');
            } catch (e) {
                console.error("Failed to load JSON");
            }
        }

        // 弹出工具详情窗口
        /* Open the detail modal for one card */
        function showInfo(title, info, imgUrl, event) {
            event.stopPropagation();
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = info || "No details available.";

            const imgEl = document.getElementById('modalImage');
            if (imgUrl && imgUrl !== 'undefined' && imgUrl !== '') {
                imgEl.src = imgUrl;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // 放大查看图片
        /* Open fullscreen preview */
        function showFullImage(src) {
            document.getElementById('fullImage').src = src;
            document.getElementById('fullScreenOverlay').style.display = 'flex';
        }
        function closeFullImage() { document.getElementById('fullScreenOverlay').style.display = 'none'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        // 按分类返回克制的强调色
        /* Map tool categories to subtle accent colors */
        function getCardAccent(tag) {
            const key = String(tag || '').toLowerCase();
            const palette = {
                doc: '56, 189, 248',
                art: '245, 158, 11',
                web: '52, 211, 153',
                sys: '148, 163, 184',
                system: '148, 163, 184'
            };

            return palette[key] || '96, 165, 250';
        }

        function renderCategorySection(category) {
            const items = (contentData[category.key] || []).filter(i => !favorites.includes(i.id));
            return `
                <section class="tool-section" id="section-${category.key}">
                    <span class="section-anchor" data-section="${category.key}" aria-hidden="true"></span>
                    <div class="section-title"><i data-lucide="${category.icon}" size="16"></i> ${category.title}</div>
                    <div class="grid">
                        ${items.map(i => createCard(i)).join('')}
                    </div>
                </section>
            `;
        }

        // 按分类返回卡片右下角的识别图标
        /* Map tool categories to subtle corner icons */
        function getCardIcon(tag) {
            const key = String(tag || '').toLowerCase();
            const icons = {
                doc: 'file-text',
                art: 'palette',
                web: 'globe',
                sys: 'settings',
                system: 'settings'
            };

            return icons[key] || 'sparkles';
        }

        // 收藏 / 取消收藏
        /* Toggle favorite status for the selected card */
        function toggleFav(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('favs', JSON.stringify(favorites));
            renderPageContent(window.currentPage || 'doc');
        }

        // 把单个工具对象渲染成一张卡片
        /* Render one tool as a clickable card */
        function createCard(item) {
            const isFav = favorites.includes(item.id);
            return `
                <div class="card" style="--card-accent-rgb: ${getCardAccent(item.tag)};" onclick='window.open(${JSON.stringify(item.link)})'>
                    <div class="card-content">
                        <h3>
                            <span class="card-title">${item.title}</span>
                            <div class="card-actions">
                                <span class="btn-icon" onclick='showInfo(${JSON.stringify(item.title)}, ${JSON.stringify(item.info || '')}, ${JSON.stringify(item.image || '')}, event)'>
                                    <i data-lucide="info" size="14" class="info-btn"></i>
                                </span>
                                <span onclick='toggleFav(${JSON.stringify(item.id)}, event)'>
                                    <i data-lucide="star" class="star-btn ${isFav ? 'active' : ''}" size="14"></i>
                                </span>
                            </div>
                        </h3>
                        <span class="tag">${item.tag}</span>
                        <p>${item.desc}</p>
                    </div>
                    <span class="card-badge" aria-hidden="true">
                        <i data-lucide="${getCardIcon(item.tag)}" size="15"></i>
                    </span>
                </div>
            `;
        }

        // 根据当前页面渲染内容：
        // 默认渲染所有分类；page 只用于导航定位
        /* Render the current page */
        function renderPageContent(page = window.currentPage || 'doc') {
            const all = [...(contentData.doc || []), ...(contentData.art || []), ...(contentData.system || []), ...(contentData.web || [])];
            const pinnedList = all.filter(i => favorites.includes(i.id));

            /* Show the pinned area only when there are favorites */
            document.getElementById('pinnedSection').style.display = pinnedList.length > 0 ? 'block' : 'none';
            document.getElementById('pinnedArea').innerHTML = pinnedList.map(i => createCard(i)).join('');
            document.getElementById('regularArea').innerHTML = categoryOrder.map(renderCategorySection).join('');
            /* Rebuild Lucide icons after injecting new HTML */
            lucide.createIcons();
        }

        function setActiveNav(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.nav-item[data-section="${page}"]`);
            if (target) target.classList.add('active');
        }

        function bindScrollSpy() {
            if (scrollObserver) scrollObserver.disconnect();

            scrollRoot = document.querySelector('.main-content');
            const anchors = Array.from(document.querySelectorAll('.section-anchor'));

            if (!anchors.length) return;
            if (!scrollRoot) return;

            scrollObserver = new IntersectionObserver((entries) => {
                const visible = entries
                    .filter(entry => entry.isIntersecting)
                    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);

                if (!visible.length) return;

                const section = visible[0].target.dataset.section;
                if (section) {
                    setActiveNav(section);
                    window.currentPage = section;
                }
            }, {
                root: scrollRoot,
                threshold: 0,
                rootMargin: '-18% 0px -72% 0px'
            });

            anchors.forEach(anchor => scrollObserver.observe(anchor));

            const updateByScroll = () => {
                if (scrollTicking) return;
                scrollTicking = true;

                requestAnimationFrame(() => {
                    const maxScrollTop = scrollRoot.scrollHeight - scrollRoot.clientHeight;
                    const currentScrollTop = scrollRoot.scrollTop;

                    if (currentScrollTop <= 120) {
                        setActiveNav('doc');
                        window.currentPage = 'doc';
                        scrollTicking = false;
                        return;
                    }

                    if (currentScrollTop >= maxScrollTop - 120) {
                        setActiveNav('system');
                        window.currentPage = 'system';
                        scrollTicking = false;
                        return;
                    }

                    const anchorsTop = anchors.map(anchor => ({
                        section: anchor.dataset.section,
                        top: anchor.getBoundingClientRect().top
                    }));

                    const visible = anchorsTop
                        .filter(item => item.top <= 140)
                        .sort((a, b) => b.top - a.top)[0] || anchorsTop[0];

                    if (visible?.section) {
                        setActiveNav(visible.section);
                        window.currentPage = visible.section;
                    }

                    scrollTicking = false;
                });
            };

            scrollRoot.addEventListener('scroll', updateByScroll, { passive: true });
            updateByScroll();
        }

        function scrollMainToTop(behavior = 'smooth') {
            const targets = [scrollRoot, document.scrollingElement, document.documentElement, document.body].filter(Boolean);
            for (const target of targets) {
                try {
                    if (typeof target.scrollTo === 'function') {
                        target.scrollTo({ top: 0, behavior });
                    } else {
                        target.scrollTop = 0;
                    }
                } catch (e) {
                    target.scrollTop = 0;
                }
            }
            window.scrollTo({ top: 0, behavior });
        }

        // 切换左侧导航页签
        /* Switch the active sidebar item and rerender */
        function loadPage(page, element) {
            window.currentPage = page;
            setActiveNav(page);
            if (!scrollRoot) return;

            if (page === 'doc') {
                scrollMainToTop('smooth');
                return;
            }

            const target = document.getElementById(`section-${page}`);
            if (target) {
                const maxScrollTop = scrollRoot.scrollHeight - scrollRoot.clientHeight;
                const targetTop = target.offsetTop - 20;
                const clampedTop = Math.max(0, Math.min(targetTop, maxScrollTop));
                scrollRoot.scrollTo({ top: clampedTop, behavior: 'smooth' });
            }
        }

        // 根据搜索框内容过滤当前页面里的卡片
        /* Filter visible cards using the search box text */
        function filterCards() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(input) ? 'flex' : 'none';
            });
        }

        // 启动页面
        /* Start the application */
        init();
    </script>
</body>
</html>
